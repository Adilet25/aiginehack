<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe1">
  <meta name="description" content="Айгине. Интерактивное путешествие по культурному наследию Кыргызстана.">
  <title>Айгине — живая память Кыргызстана</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./calendar-atlas.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./app.js"></script>
  <link rel='stylesheet' href='./exhibition.css' />
</head>
<body>
  <header class="masthead">
    <a href="#home" class="brand" aria-label="Айгине">
      <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>АЙГИНЕ</span>
    </a>
    <span class="edition" data-copy="edition">Живая память Кыргызстана</span>
    <div class="masthead-controls"><button class="journey-sound" type="button" aria-pressed="false"><span aria-hidden="true">♫</span> <span>Музыка</span></button>
    <label class="language"><span class="sr-only" data-copy="language">Язык</span><select id="language"><option value="ru">РУ</option><option value="ky">КЫ</option><option value="en">EN</option></select></label></div>
  </header>

  <main id="home">
    <section id="journey" class="journey" aria-labelledby="hero-title">
      <div class="stage" id="stage" data-inside="false" data-ready="false" data-loading="true">
        <div class="world" id="world" aria-hidden="true">
          <div class="fallback outside" hidden></div>
          <div class="fallback inside" hidden></div>
        </div>
        <p class="scene-loading" role="status">Загружаем юрту…</p>
        <a href="#inside" class="yurt-entry" tabindex="-1" aria-hidden="true"></a><div class="hero-copy">
          <p class="eyebrow" data-copy="kicker">Кыргызстан · Культурное наследие</p>
          <h1 id="hero-title" data-copy="title">Айгине</h1>
          <p class="hero-caption" data-copy="caption">Загляните в юрту.</p>
          <a href="#inside" class="button enter" data-copy="enter">Войти в юрту</a>
        </div>
        <nav class="exhibits" aria-label="Разделы" inert>
          <a class="exhibit exhibit-calendar" href="#calendar"><span class="object-ring">✦</span><span class="exhibit-label" data-copy="calendar">Кыргызский календарь</span></a>
          <a class="exhibit exhibit-places" href="#places"><span class="object-ring">✦</span><span class="exhibit-label" data-copy="places">Сакральные места</span></a>
          <a class="exhibit exhibit-stone" href="#stone"><span class="object-ring">✦</span><span class="exhibit-label" data-copy="stone">Петроглифы</span></a>
        </nav>
        <div class="stage-foot">
          <div class="chapter-index"><span id="current-stage">01</span><span class="chapter-line" aria-hidden="true"></span><span>02</span></div>
          <p class="scroll-note"><span aria-hidden="true">↓</span> <span data-copy="scroll">Прокрутите, чтобы войти</span></p>
          <a href="#home" class="back-out" data-copy="outside">Выйти из юрты</a>
          <p class="stage-location" data-copy="location">Кыргызстан · Айгине</p>
        </div>
      </div>
    </section>
  </main>
  <main id="chapter" class="chapter" hidden></main>
  <noscript>Для интерактивной экскурсии нужен JavaScript.</noscript>
</body>
</html>
